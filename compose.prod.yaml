# Single-node HTTPS pilot overlay. Use together with compose.yaml.
# The API's inherited port remains reachable only on 127.0.0.1:8000.
services:
  api:
    environment:
      COOKIE_SECURE: "true"
      ALLOWED_ORIGIN: https://${NHTRS_DOMAIN:?Set NHTRS_DOMAIN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NHTRS_DOMAIN: ${NHTRS_DOMAIN:?Set NHTRS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
